name: genrate ascii artwork

on: push

jobs:
    ascii_job:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7.0.1

            - name: install cowsay package
              run: |
                chmod +x script.sh
                ./script.sh
                
            - name: upload artifact
              uses: actions/upload-artifact@v7
              with:
                name: my-artifact
                path: dragon.txt