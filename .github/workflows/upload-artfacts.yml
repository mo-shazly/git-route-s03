name: upload-artifact-multi-jobs

#filters

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - 'feature/*'
      - main

jobs:
    build-job1:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7.0.1

            - name: install cowsay package
              run: |
                chmod +x script.sh
                ./script.sh
             
    test-job2:
      needs: build-job1
      runs-on: ubuntu-latest
      steps:
            - name: Checkout
              uses: actions/checkout@v7.0.1

            - name: install cowsay package
              run: |
                chmod +x script.sh
                ./script.sh
                ls -l


    upload-job3:
      needs: [test-job2,build-job1]
      runs-on: ubuntu-latest
      steps:
            - name: Checkout
              uses: actions/checkout@v7.0.1

            - name: install cowsay package
              run: |
                chmod +x script.sh
                ./script.sh
                
            - name: upload artifact
              uses: actions/upload-artifact@v7
              with:
                name: my-artifact
                path: dragon.txt
                retention-days: 5