name: generate ascii artwork

on: push

jobs:
  cowsay:
     runs-on: ubuntu-latest
     steps:
        - name: checkout
          uses: actions/checkout@v7

        - name: add execute permission
          run: chmod +x script.sh

        - name: install cowsay
          run: ./script.sh

        - uses: actions/upload-artifact@v7
          with:
            name: my-artifact
            path: dragon.txt

